<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="bolt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#38bdf8" flood-opacity="0.45" />
    </filter>
  </defs>
  <!-- Fondo Squircle Profesional -->
  <rect width="512" height="512" rx="136" ry="136" fill="url(#bg-grad)" />
  <rect width="504" height="504" x="4" y="4" rx="132" ry="132" fill="none" stroke="#38bdf8" stroke-width="8" stroke-opacity="0.35" />
  <!-- Ícono Lightning Bolt (Rayito) -->
  <path d="M 296 64 L 152 288 L 264 288 L 216 448 L 360 224 L 248 224 Z" fill="url(#bolt-grad)" filter="url(#glow)" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" />
</svg>
