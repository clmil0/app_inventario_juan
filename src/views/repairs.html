<div class="ui-view repairs-view">
    <section class="ui-head" data-anim="1">
        <h1 class="ui-h1">Reparaciones</h1>
        <div class="ui-head-actions">
            <div class="ui-seg" id="rep-views">
                <button data-view="board" class="active">Tablero</button>
                <button data-view="list">Lista</button>
            </div>
            <button id="new-repair-btn" class="ui-btn">
                <span class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></span>
                Nueva reparación
            </button>
        </div>
    </section>

    <section class="ui-kpis" id="rep-kpis"></section>

    <section class="rep-toolbar" data-anim="1">
        <div class="ui-search" style="max-width:440px">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM21 21l-4.3-4.3"></path></svg>
            <input type="text" id="repair-global-search" placeholder="Buscar por ticket, cliente, teléfono, equipo o falla..." autocomplete="off">
        </div>
        <div class="ui-chips" id="rep-filters"></div>
        <span class="ui-card-sub hidden" id="rep-result-txt"></span>
    </section>

    <section id="rep-board" class="rep-board"></section>

    <section id="rep-list" class="ui-card" style="display:none;padding:20px 24px;gap:6px">
        <div class="ui-table-scroll">
            <div class="ui-table rep-table">
                <div class="ui-thead"><span>Ticket · ingreso</span><span>Cliente</span><span>Equipos</span><span>Estado</span><span>Atiende</span><span class="r">Total</span><span class="r">Saldo</span><span></span></div>
                <div id="repairs-list"></div>
            </div>
        </div>
        <div class="rep-pager">
            <span class="ui-card-sub" id="rep-page-info"></span>
            <div class="rep-pages" id="rep-pages"></div>
        </div>
    </section>
</div>
