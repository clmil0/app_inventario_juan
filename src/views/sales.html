<div class="ui-view sales-view">
    <section class="ui-head" data-anim="1">
        <h1 class="ui-h1">Punto de venta</h1>
        <div class="ui-seg" id="sales-tabs-container">
            <button id="tab-pos" class="active" data-mode="pos" style="padding:11px 22px">Vender</button>
            <button id="tab-hist" data-mode="hist" style="padding:11px 22px">Historial de ventas</button>
        </div>
    </section>

    <!-- ===== PUNTO DE VENTA ===== -->
    <section id="pos-main-layout" class="pos-grid">
        <div class="pos-left">
            <div class="pos-toolbar" data-anim="1">
                <div class="ui-search">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM21 21l-4.3-4.3"></path></svg>
                    <input type="text" id="product-search" placeholder="Buscar por nombre, código o marca..." autocomplete="off">
                </div>
                <div class="ui-seg ui-seg--ink ui-seg--sm">
                    <button id="pos-view-sale" class="active">Precio venta</button>
                    <button id="pos-view-cost">Costo y margen</button>
                </div>
            </div>

            <div id="favorites-section" class="pos-favs" data-anim="1">
                <div class="pos-section-title">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="#f0c132" stroke="#f0c132" stroke-width="1"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path></svg>
                    Frecuentes
                </div>
                <div id="favorites-grid" class="pos-fav-grid"></div>
            </div>

            <div class="ui-card" data-anim="1" style="padding:24px;gap:16px">
                <div class="ui-card-head">
                    <div class="ui-card-title">Catálogo</div>
                    <span class="ui-card-sub" id="pos-count">0 productos</span>
                </div>
                <div id="products-grid" class="pos-grid-products"></div>
            </div>
        </div>

        <!-- Carrito -->
        <aside class="pos-cart" id="pos-cart-panel" data-anim="1">
            <div class="pos-cart-head">
                <div style="font-size:18px;font-weight:500">Carrito de cobro</div>
                <span class="ui-badge orange" id="cart-btn-badge-wrap"><span id="cart-btn-badge">0</span> ítems</span>
                <button id="clear-cart-btn" class="pos-cart-clear" title="Vaciar carrito">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>Vaciar
                </button>
            </div>
            <div class="pos-cart-fields">
                <input type="text" id="sale-customer" class="dark-field" placeholder="Cliente (opcional)">
                <input type="number" id="sale-discount" class="dark-field" placeholder="Desc. S/" min="0" step="0.50" inputmode="decimal">
            </div>

            <div id="cart-items" class="pos-cart-items">
                <p class="cart-empty">Agrega productos al carrito</p>
            </div>

            <div class="pos-cart-foot">
                <div class="pos-cart-summary">
                    <div class="pos-cart-sum-left">
                        <div class="row"><span>Subtotal</span><span id="cart-subtotal">S/ 0.00</span></div>
                        <div class="row" id="cart-discount-row" style="display:none"><span>Descuento</span><span id="cart-discount-amount" style="color:var(--orange-soft)">−S/ 0.00</span></div>
                        <div class="row dashed" id="cart-cost-row" style="display:none"><span>Costo total</span><span id="cart-total-cost" style="color:var(--yellow)">S/ 0.00</span></div>
                        <div class="row" id="cart-profit-row" style="display:none"><span>Ganancia</span><span id="cart-total-profit" style="color:var(--blue-soft)">S/ 0.00</span></div>
                    </div>
                    <div class="pos-cart-total"><span>Total</span><span id="cart-total-amount">S/ 0.00</span></div>
                </div>

                <div class="pos-sellers-row" id="pos-sellers-group">
                    <span class="dark-label">Atendido por *</span>
                    <div class="pos-sellers" id="pos-sellers">
                        <div class="slider"></div>
                        <input type="radio" id="sale-seller-juan" name="sale-active-seller" value="Juan" hidden>
                        <label for="sale-seller-juan">Juan</label>
                        <input type="radio" id="sale-seller-junior" name="sale-active-seller" value="Junior" hidden>
                        <label for="sale-seller-junior">Junior</label>
                    </div>
                </div>

                <div style="display:flex;flex-direction:column;gap:8px" id="pos-pay-group">
                    <span class="dark-label">Método de pago *</span>
                    <input type="hidden" id="sale-payment-method" value="">
                    <div class="ui-opt-grid pos-pay-grid" id="pos-pay-options">
                        <button class="ui-opt center" data-pay="Caja" title="Caja (efectivo)">Efectivo</button>
                        <button class="ui-opt center" data-pay="Yape/Plin">Yape/Plin</button>
                        <button class="ui-opt center" data-pay="Transferencia">Transfer.</button>
                        <button class="ui-opt center" data-pay="POS" title="Tarjeta (POS)">Tarjeta</button>
                    </div>
                </div>

                <button id="confirm-sale-btn" class="ui-pill orange" disabled>Confirmar venta<span id="confirm-sale-total"></span></button>
            </div>
        </aside>
    </section>

    <!-- ===== HISTORIAL DE VENTAS ===== -->
    <div id="sales-history-layout" class="ui-view" style="display:none">
        <section class="sales-hist-filters" data-anim="1">
            <div class="ui-seg" id="hist-periods">
                <button data-period="today">Hoy</button>
                <button data-period="yesterday">Ayer</button>
                <button data-period="week">Semana actual</button>
                <button data-period="month" class="active">Mes actual</button>
                <button data-period="year">Año actual</button>
                <button data-period="all">Todo</button>
                <button data-period="custom">Fecha específica</button>
            </div>
            <div class="hist-custom hidden" id="hist-custom">
                <span>Desde</span><input type="date" id="hist-from">
                <span>Hasta</span><input type="date" id="hist-to">
            </div>
            <span class="ui-card-sub" id="hist-range-label"></span>
        </section>

        <section class="ui-kpis" id="hist-kpis"></section>

        <section class="ui-card" data-anim="1" style="padding:24px 28px">
            <div class="ui-card-head">
                <div class="ui-card-title">Historial de ventas</div>
                <div class="ui-chips">
                    <div class="ui-chips" id="hist-pay-chips"></div>
                    <div class="ui-chips" id="hist-vendor-chips"></div>
                    <div class="ui-search sm" style="width:260px">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM21 21l-4.3-4.3"></path></svg>
                        <input type="text" id="all-sales-search" placeholder="Cliente, producto, marca o ticket...">
                    </div>
                </div>
            </div>
            <div class="ui-table-scroll">
                <div class="ui-table hist-table">
                    <div class="ui-thead" id="all-sales-thead"></div>
                    <div id="all-sales-tbody"></div>
                </div>
            </div>
            <div style="text-align:center">
                <button id="load-more-sales-btn" class="ui-pill outline" style="display:none">Mostrar más</button>
            </div>
        </section>
    </div>
</div>
