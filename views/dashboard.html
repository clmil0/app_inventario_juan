<div class="dashboard-filters glass mb-4">
    <div class="filter-pills">
        <button class="filter-pill active" data-period="today"><span class="hidden-mobile">☀️ </span>Hoy</button>
        <button class="filter-pill" data-period="yesterday"><span class="hidden-mobile">⏳ </span>Ayer</button>
        <button class="filter-pill" data-period="week">
            <span class="hidden-mobile">📅 Semana actual</span><span class="hidden-desktop">Sem. act</span>
        </button>
        <button class="filter-pill hide-mobile" data-period="month"><span class="hidden-mobile">📅 </span>Mes actual</button>
        <button class="filter-pill hide-mobile" data-period="semester"><span class="hidden-mobile">📊 </span>Semestre actual</button>
        <button class="filter-pill hide-mobile" data-period="year"><span class="hidden-mobile">🗓️ </span>Año actual</button>
        <button class="filter-pill" data-period="all"><span class="hidden-mobile">🌐 </span>Todo</button>
        <button class="filter-pill" data-period="custom">
            <span class="hidden-mobile">🔍 Fecha específica</span><span class="hidden-desktop">F. esp</span>
        </button>
    </div>
    <div id="custom-date-container" class="custom-date-picker hidden">
        <div class="date-input-group">
            <label>Desde:</label>
            <input type="date" id="dash-date-from" class="date-input">
        </div>
        <div class="date-input-group">
            <label>Hasta:</label>
            <input type="date" id="dash-date-to" class="date-input">
        </div>
        <button id="apply-custom-date-btn" class="btn-primary btn-sm" style="padding: 0.35rem 0.8rem;">Aplicar</button>
    </div>
</div>

<div class="kpi-grid">
    <div class="kpi-card glass kpi-green">
        <div class="kpi-icon">💰</div>
        <div class="kpi-body">
            <div class="kpi-label">Gan. Total</div>
            <div class="kpi-value" id="kpi-ganancia-total">S/ 0.00</div>
        </div>
    </div>
    <div class="kpi-card glass kpi-teal">
        <div class="kpi-icon">🛠️</div>
        <div class="kpi-body">
            <div class="kpi-label">Gan. Rep.</div>
            <div class="kpi-value" id="kpi-ganancia-reparaciones">S/ 0.00</div>
        </div>
    </div>
    <div class="kpi-card glass kpi-blue">
        <div class="kpi-icon">💵</div>
        <div class="kpi-body">
            <div class="kpi-label">Gan. Ventas</div>
            <div class="kpi-value" id="kpi-ganancia-ventas">S/ 0.00</div>
        </div>
    </div>
    <div class="kpi-card glass kpi-purple">
        <div class="kpi-icon">📦</div>
        <div class="kpi-body">
            <div class="kpi-label">Inv. Ventas</div>
            <div class="kpi-value" id="kpi-invertido-ventas">S/ 0.00</div>
        </div>
    </div>
    <div class="kpi-card glass kpi-yellow">
        <div class="kpi-icon">🛒</div>
        <div class="kpi-body">
            <div class="kpi-label"># Ventas</div>
            <div class="kpi-value" id="kpi-total-ventas">0</div>
        </div>
    </div>
    <div class="kpi-card glass kpi-orange">
        <div class="kpi-icon">🔧</div>
        <div class="kpi-body">
            <div class="kpi-label"># Rep.</div>
            <div class="kpi-value" id="kpi-total-reparaciones">0</div>
        </div>
    </div>
    <div class="kpi-card glass kpi-red">
        <div class="kpi-icon">⚠️</div>
        <div class="kpi-body">
            <div class="kpi-label">Stock Bajo</div>
            <div class="kpi-value" id="kpi-stock-bajo">0</div>
        </div>
    </div>
</div>

<div class="charts-grid">
    <div class="chart-card glass">
        <h3>Ventas Últimos 30 Días</h3>
        <div class="chart-container"><canvas id="chart-sales"></canvas></div>
    </div>
    <div class="chart-card glass">
        <h3>Top 5 Productos Más Vendidos</h3>
        <div class="chart-container"><canvas id="chart-top-products"></canvas></div>
    </div>
    <div class="chart-card glass">
        <h3>Reparaciones por Estado</h3>
        <div class="chart-container"><canvas id="chart-repairs-status"></canvas></div>
    </div>
</div>
